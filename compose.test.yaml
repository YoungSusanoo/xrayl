services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: xrayl
      POSTGRES_DB: xrayl_test
      POSTGRES_PASSWORD: xrayl_test
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
